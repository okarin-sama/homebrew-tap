name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  formula:
    name: brew style + install + test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: brew style
        run: brew style Formula/worklog.rb

      # brew refuses formula files outside a tap, so stage this checkout as the
      # real tap locally (the formula's file:// source is the tarball vendored
      # in dist/ — everything a user gets after `brew tap` is reproduced).
      - name: Stage this checkout as okarin-sama/homebrew-tap
        run: |
          TAPDIR="$(brew --repository)/Library/Taps/okarin-sama/homebrew-tap"
          mkdir -p "$TAPDIR"
          cp -R Formula dist "$TAPDIR/"
          git -C "$TAPDIR" init -q
          git -C "$TAPDIR" add -A
          git -C "$TAPDIR" -c user.name=ci -c user.email=ci@localhost commit -qm staged
          brew trust okarin-sama/tap

      - name: Install from the staged tap
        run: brew install okarin-sama/tap/worklog

      - name: Formula test block (--help x3, needs no twg)
        run: brew test okarin-sama/tap/worklog

      - name: Smoke the installed commands
        run: |
          printf 'DEMO-421 1h Today op:65:Support #data architecture\n' > "$RUNNER_TEMP/entries"
          export WORKLOG_ENTRIES="$RUNNER_TEMP/entries"
          worklog-run --print-map | grep -Eq '^DEMO-421[[:space:]]+65[[:space:]]+Support'
          worklog-run --jira-only --dry-run | grep -q 'Planned worklogs (1 entries)'
          worklog-add --help >/dev/null && op-sync --help >/dev/null && worklog-summary --help >/dev/null
